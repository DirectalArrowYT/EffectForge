[package]
name = "effect_forge"
version = "0.1.0"
edition = "2021"
description = "Make and edit Smash Ultimate effects from models and textures"

[[bin]]
name = "effect_forge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = "0.15"
wgpu = { version = "29.0.0", features = ["spirv"] }
bytemuck = { version = "1", features = ["derive"] }
effect_library = "1.1.4"
bntx = { git = "https://github.com/ScanMountGoat/bntx.git", rev = "87fffc7d17238cb07ff93ec75e0a7b5db15f4683" }
binrw = "0.15"
image_dds = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
dirs = "5"
glam = "0.28.0"
gltf = { version = "1", default-features = false, features = ["import", "utils"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Crash logs name files and lines.
[profile.release]
debug = "line-tables-only"

[patch.crates-io]
effect_library = { path = "vendor/effect_library" }
